services:
  - type: web
    name: voizex-site
    runtime: node
    rootDir: site
    buildCommand: "echo ok"
    startCommand: "node server.js"
    plan: free
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SECRET
        generateValue: true
