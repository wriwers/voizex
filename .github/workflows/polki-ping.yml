# Держит сервис на Render бодрствующим (бесплатный план засыпает через 15 минут без запросов),
# чтобы бот «Полки» отвечал на кнопки сразу, и будит утреннюю сводку.
name: polki-ping
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS -m 120 https://voizex.onrender.com/polki/ping || curl -fsS -m 120 https://voizex.onrender.com/polki/ping
